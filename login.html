<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="Assets/Logo.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"
      defer
    ></script>
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
      .floating-icon {
        animation: float 3s ease-in-out infinite;
      }

      @keyframes float {
        0% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-15px);
        }
        100% {
          transform: translateY(0);
        }
      }
    </style>
    <title>Login</title>
  </head>
  <body class="bg-gray-50 text-gray-800">
    <div
      class="min-h-screen flex items-center justify-center bg-gray-100 px-6"
      x-data="{ username: '', password: '', showPassword: false }"
    >
      <!-- Background Image -->
      <div class="absolute inset-0">
        <img
          src="Assets/Bg-hero-banner.png"
          class="w-full h-full object-cover"
          alt="Background"
        />
      </div>

      <!-- Floating Icons -->
      <img
        src="Assets/Icon-1.png"
        class="floating-icon absolute top-40 left-10 lg:left-20 w-16"
      />

      <img
        src="Assets/Icon-2.png"
        class="floating-icon absolute center-30 right-10 lg:right-20 w-20"
      />

      <img
        src="Assets/Icon-3.png"
        class="floating-icon absolute md:bottom-20 bottom-0 right-30 lg:right-30 w-20"
      />
      <div
        class="relative bg-white rounded-2xl shadow-xl p-10 w-full max-w-3xl border border-gray-200"
      >
        <!-- Logo -->
        <div class="flex items-center mb-8">
          <a href="index.html" class="inline-flex items-center gap-3">
            <!-- gunakan path file upload -->
            <img
              src="Assets/Logo.png"
              alt="EcoRecycle"
              class="w-9 h-9 object-contain"
            />
            <span class="font-semibold text-gray-800 text-2xl">EcoRecycle</span>
          </a>
        </div>
        <div class="max-w-lg mx-auto">
          <!-- Title -->
          <h2 class="text-5xl font-bold text-center mb-2">Welcome back!</h2>

          <p class="text-center text-gray-500 mb-10">
            Login untuk membuat dampak yang lebih besar. dan bantu ciptakan masa
            depan yang lebih hijau.
          </p>

          <!-- Username -->
          <input
            type="text"
            placeholder="Username"
            class="w-full mb-4 px-4 py-3 rounded-full border border-gray-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none"
            x-model="username"
          />

          <div class="relative">
            <!-- Input Password -->
            <input
              :type="showPassword ? 'text' : 'password'"
              placeholder="Password"
              class="w-full px-4 py-3 rounded-full border border-gray-300 focus:ring-2 focus:ring-emerald-500 focus:outline-none"
              x-model="password"
            />

            <!-- Tombol Icon Mata -->
            <button
              type="button"
              class="absolute right-4 inset-y-0 flex items-center text-gray-400"
              @click="showPassword = !showPassword"
            >
              <template x-if="!showPassword">
                <!-- Icon Mata -->
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.5"
                  stroke="currentColor"
                  class="w-5 h-5"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M2.036 12.322c2.29-4.387 6.343-7.322 9.964-7.322 3.62 0 7.674 2.935 9.964 7.322-2.29 4.387-6.343 7.322-9.964 7.322-3.62 0-7.674-2.935-9.964-7.322z"
                  />
                  <circle cx="12" cy="12" r="3" stroke="currentColor" />
                </svg>
              </template>

              <template x-if="showPassword">
                <!-- Icon Mata Tertutup -->
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.5"
                  stroke="currentColor"
                  class="w-5 h-5"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M2.036 12.322c2.29-4.387 6.343-7.322 9.964-7.322 3.62 0 7.674 2.935 9.964 7.322-2.29 4.387-6.343 7.322-9.964 7.322-3.62 0-7.674-2.935-9.964-7.322z"
                  />
                  <circle cx="12" cy="12" r="3" stroke="currentColor" />
                </svg>
              </template>
            </button>
          </div>

          <div class="text-right mb-4 mt-3">
            <a href="#" class="text-sm text-gray-600 hover:underline"
              >Forgot Password?</a
            >
          </div>

          <!-- Login Button -->
          <button
            @click="
            if (username.trim() !== '' && password.trim() !== '') {
            window.location.href = 'dashboard.html'
            } else {
            alert('Silakan isi Username dan Password')
            }
        "
            class="w-full py-3 rounded-full bg-emerald-600 text-white font-semibold hover:brightness-90 transition"
          >
            Login
          </button>
        </div>
        <!-- Divider -->
        <div class="flex items-center my-8">
          <span class="flex-1 border-t"></span>
          <span class="px-4 text-gray-400">or continue with</span>
          <span class="flex-1 border-t"></span>
        </div>

        <!-- Social Login Icons -->
        <div class="flex justify-center gap-6 mb-8">
          <img src="Assets/L-google.png" class="w-10 h-10 cursor-pointer" />
          <img src="Assets/L-apple.png" class="w-10 h-10 cursor-pointer" />
          <img src="Assets/L-facebook.png" class="w-10 h-10 cursor-pointer" />
        </div>

        <!-- Register -->
        <div class="text-center text-gray-600">
          Not a member?
          <a
            href="register.html"
            class="text-emerald-600 font-semibold hover:underline"
          >
            Register now
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
