<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="Assets/Logo.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
      defer
    ></script>
    <title>Edit password</title>
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>

  <body class="bg-gray-100" x-data="editProfile">
    <!-- NAVBAR -->
    <nav
      class="w-full bg-white border-b px-6 py-4 flex items-center justify-between shadow-sm"
    >
      <!-- LEFT -->
      <div
        class="flex items-center gap-3 cursor-pointer"
        onclick="history.back()"
      >
        <img src="Assets/Back.png" class="w-5" />
        <div>
          <h1 class="text-lg font-semibold">Edit Password</h1>
          <p class="text-sm text-gray-500 -mt-1">Perbarui Password Anda</p>
        </div>
      </div>
    </nav>

    <!-- MAIN CONTENT -->
    <section
      class="max-w-2xl mx-auto mt-10 rounded-xl overflow-hidden px-4 mb-10"
      x-data="{
        password: '',
        confirmPassword: '',
        showPassword1: false,
        showPassword2: false,
        showPassword3: false,
    }"
    >
      <div class="bg-white p-6 md:p-8 rounded-2xl shadow-md space-y-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-2">Update Password</h1>

        <!-- Current Password -->
        <div class="space-y-1">
          <label class="font-medium text-gray-700">Current Password</label>
          <div class="relative">
            <input
              :type="showPassword1 ? 'text' : 'password'"
              placeholder="Enter current password"
              class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500"
              x-model="password"
            />
            <button
              type="button"
              class="absolute right-4 inset-y-0 flex items-center text-gray-400"
              @click="showPassword1 = !showPassword1"
            >
              <template x-if="!showPassword1">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.5"
                  stroke="currentColor"
                  class="w-5 h-5"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M2.036 12.322c2.29-4.387 6.343-7.322 9.964-7.322s7.674 
                 2.935 9.964 7.322c-2.29 4.387-6.343 7.322-9.964 
                 7.322s-7.674-2.935-9.964-7.322z"
                  />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </template>
              <template x-if="showPassword1">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.5"
                  stroke="currentColor"
                  class="w-5 h-5"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M2.036 12.322c2.29-4.387 6.343-7.322 9.964-7.322s7.674 
                 2.935 9.964 7.322c-2.29 4.387-6.343 7.322-9.964 
                 7.322s-7.674-2.935-9.964-7.322z"
                  />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </template>
            </button>
          </div>
        </div>

        <!-- New Password -->
        <div class="space-y-1">
          <label class="font-medium text-gray-700">New Password</label>
          <div class="relative">
            <input
              :type="showPassword2 ? 'text' : 'password'"
              placeholder="Enter new password"
              class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500"
              x-model="newPassword"
            />
            <button
              type="button"
              class="absolute right-4 inset-y-0 flex items-center text-gray-400"
              @click="showPassword2 = !showPassword2"
            >
              <template x-if="!showPassword2">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.5"
                  stroke="currentColor"
                  class="w-5 h-5"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M2.036 12.322c2.29-4.387 6.343-7.322 9.964-7.322s7.674 
                 2.935 9.964 7.322c-2.29 4.387-6.343 7.322-9.964 
                 7.322s-7.674-2.935-9.964-7.322z"
                  />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </template>
              <template x-if="showPassword2">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.5"
                  stroke="currentColor"
                  class="w-5 h-5"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M2.036 12.322c2.29-4.387 6.343-7.322 9.964-7.322s7.674 
                 2.935 9.964 7.322c-2.29 4.387-6.343 7.322-9.964 
                 7.322s-7.674-2.935-9.964-7.322z"
                  />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </template>
            </button>
          </div>
        </div>

        <!-- Confirm Password -->
        <div class="space-y-1">
          <label class="font-medium text-gray-700">Confirm New Password</label>
          <div class="relative">
            <input
              :type="showPassword3 ? 'text' : 'password'"
              placeholder="Re-enter new password"
              class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500"
              x-model="newPassword"
            />
            <button
              type="button"
              class="absolute right-4 inset-y-0 flex items-center text-gray-400"
              @click="showPassword3 = !showPassword3"
            >
              <template x-if="!showPassword3">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.5"
                  stroke="currentColor"
                  class="w-5 h-5"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M2.036 12.322c2.29-4.387 6.343-7.322 9.964-7.322s7.674 
                 2.935 9.964 7.322c-2.29 4.387-6.343 7.322-9.964 
                 7.322s-7.674-2.935-9.964-7.322z"
                  />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </template>
              <template x-if="showPassword3">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.5"
                  stroke="currentColor"
                  class="w-5 h-5"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M2.036 12.322c2.29-4.387 6.343-7.322 9.964-7.322s7.674 
                 2.935 9.964 7.322c-2.29 4.387-6.343 7.322-9.964 
                 7.322s-7.674-2.935-9.964-7.322z"
                  />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </template>
            </button>
          </div>
        </div>

        <!-- Buttons -->
        <div class="flex justify-end gap-3 pt-4">
          <button
            class="px-6 py-2 rounded-lg border text-gray-600 hover:bg-gray-100"
            onclick="history.back()"
          >
            Batal
          </button>

          <button
            class="px-6 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white font-medium"
            onclick="window.location.href='dashboard.html'"
          >
            Simpan
          </button>
        </div>
      </div>
    </section>

    <!-- ALPINE.JS LOGIC -->
    <script></script>
  </body>
</html>
